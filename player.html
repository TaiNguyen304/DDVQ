<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Disable DevTools -->
    <script src="disable-devtools.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Thí Sinh - Đường Đến Vinh Quang</title>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id') || sessionStorage.getItem('ddvq_contestant_id') || localStorage.getItem('contestant_id') || '1';
            const targetId = ['1', '2', '3', '4'].includes(idParam) ? idParam : '1';
            window.location.replace(`player${targetId}.html${window.location.search}`);
        })();
    </script>
</head>
<body style="background: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    <p>Đang chuyển hướng đến màn hình Thí sinh...</p>
</body>
</html>
